name: Edric compile gate

on:
  push:
    branches:
      - edric-compile-next
  workflow_dispatch:

jobs:
  compile-and-run:
    runs-on: ubuntu-latest
    env:
      IDRIS2_CG: chez
      SCHEME: scheme
      IDRIS2_PATH: ${{ github.workspace }}/Idric/libs/prelude/build/ttc:${{ github.workspace }}/Idric/libs/base/build/ttc:${{ github.workspace }}/Idric/libs/linear/build/ttc:${{ github.workspace }}/Idric/libs/network/build/ttc:${{ github.workspace }}/Idric/libs/contrib/build/ttc:${{ github.workspace }}/Idric/libs/test/build/ttc
    steps:
      - name: Checkout machines
        uses: actions/checkout@v4
        with:
          path: machines

      - name: Checkout pinned Idriç compiler
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric
          ref: 9b0bf7fa8be9483440e6ec0530f3aef3999a8735
          path: Idric

      - name: Cache bootstrapped Idriç
        id: idric-cache
        uses: actions/cache@v4
        with:
          path: |
            Idric/build
            Idric/bootstrap-build
            Idric/libs/prelude/build
            Idric/libs/base/build
            Idric/libs/linear/build
            Idric/libs/network/build
            Idric/libs/contrib/build
            Idric/libs/test/build
            Idric/libs/papers/build
          key: idric-${{ runner.os }}-9b0bf7fa8be9483440e6ec0530f3aef3999a8735-v1

      - name: Install Chez Scheme
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme

      - name: Bootstrap Idriç
        if: steps.idric-cache.outputs.cache-hit != 'true'
        working-directory: Idric
        run: make bootstrap SCHEME=scheme

      - name: Compile machines Edric regression program
        working-directory: machines
        run: |
          cp edric/tests/Main.idric edric/src/Main.idric
          ../Idric/build/exec/idris2 --source-dir edric/src edric/src/Main.idric -o machines-edric

      - name: Run machines Edric regression program
        working-directory: machines
        run: ./build/exec/machines-edric
